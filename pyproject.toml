[project]
name = "tirramind-agent"
version = "0.1.0"
description = "Machine intelligence system — SOTA math, ML, and engineering fused into an autonomous agent that discovers predictive structure across heterogeneous data domains"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "httpx>=0.25",
    "chromadb>=0.4",
    "pydantic>=2.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "yfinance>=0.2",
    "jsonschema>=4.0",
    "apscheduler>=3.10,<4.0",
    "pyyaml>=6.0",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
quant = [
    "numpy>=1.24",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "hmmlearn>=0.3",
    "filterpy>=1.4",
    "pgmpy>=0.1",
    "cvxpy>=1.4",
    "networkx>=3.0",
]
ml = [
    "torch>=2.0",
    "torch-geometric>=2.5",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
    "pre-commit>=3.5",
]
local = ["ollama>=0.1"]
discovery = ["tigramite>=5.2"]

[project.scripts]
tirra-agent = "agent.cli:main"
tirra-workflow-check = "agent.workflow_guard:main"
tirra-wiki-catalog = "agent.wiki.catalog:main"
tirra-awos = "agent.awos.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -q"
markers = [
    "slow: marks tests that take >10s (deselect with -m 'not slow')",
    "integration: marks tests requiring network or real API (deselect with -m 'not integration')",
    "live: marks tests hitting real external endpoints",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security)
]
ignore = [
    "S101",  # assert used (fine in tests)
    "S603",  # subprocess call (we sandbox)
    "S607",  # partial path (we validate)
    "E501",  # line too long (ruff format handles this)
    # Cosmetic / style — not enforced on existing codebase
    "F841",  # local variable assigned but never used
    "B007",  # loop control variable unused (rename to _ is noise in tests)
    "B905",  # zip() without strict= (intentional throughout)
    "B017",  # assert raises Exception (acceptable in tests)
    "E402",  # module-level import not at top (intentional in some modules)
    "E731",  # lambda assignment (clarity over dogma)
    "E741",  # ambiguous variable name
    "UP042", # explicit class inheritance
    "SIM102", # nested if → single if
    "SIM105", # try/except/pass → contextlib.suppress
    "SIM108", # if/else → ternary
    "SIM117", # nested with → single with
    "SIM202", # not in
    "SIM222", # or simplification
    "S110",  # try/except/pass (intentional in several places)
    "S311",  # pseudo-random not for crypto (intentional — not crypto code)
    "S310",  # audit URL open (all URLs are hardcoded public API endpoints)
    "S602",  # shell=True in shell_runner (intentional — sandboxed tool)
    "S608",  # SQL f-string — all dynamic parts are hardcoded column names; values use ?
    "S112",  # try/except/continue — intentional in pipeline loops
    "B018",  # useless expression — used to test set-literal hashability in tests
    "B904",  # raise from err — style choice
    "SIM103", # return negation — style
    "SIM110", # use any() — style
    "W291",  # trailing whitespace inside string literals (e.g. CSV test data)
    "W293",  # blank line with whitespace
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "S108", "S314"]  # S314: test fixtures build their own XML

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
