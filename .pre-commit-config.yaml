# Pre-commit hooks — fast checks at commit time.
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: tirramind-workflow-preflight
        name: TirraMind workflow preflight
        entry: python3 -m agent.workflow_guard --staged
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: tirramind-obsidian-lint
        name: TirraMind obsidian lint (FM01/FM02 blocking)
        entry: python3 scripts/obsidian_lint.py --strict --no-stale
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: tirramind-fact-lint
        name: TirraMind fact drift lint (FL01/FL03)
        entry: python3 scripts/fact_lint.py
        language: system
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
