# TirraMind CI — lint + vault health + full test suite on every push and PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Ruff lint & format check ─────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check agent/ tests/
      - run: ruff format --check agent/ tests/

  # ── 2. Obsidian vault health ─────────────────────────────────────────────
  # Fails on FM01/FM02 (missing frontmatter) and LK01 (broken wiki links).
  # Fails on FL01/FL03 (fact drift — numeric constants copied outside owner).
  vault-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install vault-lint deps
        run: pip install pyyaml
      - name: Obsidian lint (FM01/FM02/LK01 are errors; LK02/ST* advisory)
        run: python scripts/obsidian_lint.py --strict --no-stale
      - name: Fact drift lint (FL01/FL03 are errors)
        run: python scripts/fact_lint.py

  # ── 3. Full test suite (Python 3.11 + 3.12) ─────────────────────────────
  # torch-geometric requires torch to be present before install, so we
  # install the CPU-only wheel explicitly rather than using the ml extra.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install base + quant deps
        run: pip install -e ".[dev,quant]"

      # CPU-only torch (~270 MB) — avoids the 2+ GB CUDA wheel.
      #
      # Was pinned to 2.2.2. That pin quietly broke 208 tests: torch 2.2.2 is
      # built against the numpy 1.x ABI, while `.[quant]` resolves numpy to
      # 2.5.2 on the line above, so every tensor<->numpy conversion raised
      # "RuntimeError: Numpy is not available". Pinning numpy back is not an
      # option — scipy 1.18.1 requires numpy>=2.0.0,<2.8 — so torch moves
      # instead.
      #
      # 2.13.0 is chosen because it is what the project's own .venv runs, where
      # the suite passes against this same numpy 2.5.2. Matching CI to the
      # environment the tests are actually developed in removes the drift
      # rather than papering over it. PyG publishes cpu wheels for it, and
      # torch publishes cp311 and cp312 cpu wheels, which the matrix needs.
      - name: Install torch (CPU-only)
        run: |
          pip install torch==2.13.0+cpu --index-url https://download.pytorch.org/whl/cpu

      # PyG wheels keyed to torch version — must come after torch
      - name: Install torch-geometric (CPU-only)
        run: |
          pip install torch-geometric \
            --find-links https://data.pyg.org/whl/torch-2.13.0+cpu.html

      - name: Run tests (exclude live/slow)
        run: pytest tests/ -v --tb=short -m "not live and not slow"
