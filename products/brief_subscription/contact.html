<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Contact — TirraMind</title>
  <meta name="description" content="Get in touch with the TirraMind team. We read every message.">
  <style>
    :root {
      --ink: #111;
      --mut: #666;
      --acc: #3730a3;
      --acc-soft: #eef2ff;
      --bg: #fafafa;
      --surface: #fff;
      --line: #e5e5e5;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #f5f5f5;
        --mut: #a0a0a0;
        --acc: #8b5cf6;
        --acc-soft: #3730a3;
        --bg: #0f0f0f;
        --surface: #1a1a1a;
        --line: #2a2a2a;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .wrap { max-width: 900px; margin: 0 auto; padding: 0 32px; }
    header {
      padding: 40px 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 100;
    }
    .brand { font-weight: 700; font-size: 16px; letter-spacing: -0.015em; }
    .brand em { font-style: normal; color: var(--acc); }
    nav a {
      color: var(--mut);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      transition: color 0.2s;
    }
    nav a:hover, nav a:focus { color: var(--ink); outline: none; }
    nav a:focus-visible { outline: 2px solid var(--acc); outline-offset: 4px; }
    main { padding: 60px 0 60px; }
    h1 { font-size: 44px; letter-spacing: -0.02em; margin-bottom: 12px; font-weight: 750; }
    .lede { color: var(--mut); font-size: 17px; max-width: 600px; margin-bottom: 48px; line-height: 1.65; }

    .contact-form {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 32px;
      max-width: 500px;
      box-shadow: var(--shadow-sm);
    }
    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
    }
    label {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--ink);
    }
    input, textarea {
      font-family: inherit;
      font-size: 14px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--ink);
      transition: all 0.2s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--acc);
      box-shadow: 0 0 0 3px rgba(55, 48, 163, 0.1);
    }
    textarea {
      resize: vertical;
      min-height: 120px;
      font-family: inherit;
    }
    .submit-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--acc);
      color: #fff;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      border: none;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: var(--shadow-sm);
      width: 100%;
    }
    .submit-btn:hover:not(:disabled) {
      filter: brightness(0.9);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }
    .submit-btn:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .message {
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .message.success {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
      display: block;
    }
    .message.error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
      display: block;
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 40px 0 48px;
      color: var(--mut);
      font-size: 13px;
      margin-top: 60px;
    }
    footer a { color: var(--mut); text-decoration: none; margin-right: 24px; transition: color 0.2s; }
    footer a:hover, footer a:focus { color: var(--ink); }
    footer a:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
    .contact-footer { margin-top: 12px; font-size: 12.5px; }

    @media (max-width: 768px) {
      .wrap { padding: 0 24px; }
      h1 { font-size: 32px; }
      main { padding: 40px 0 40px; }
      header { padding: 24px 0; }
      .contact-form { padding: 24px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">Tirra<em>Mind</em></div>
      <nav><a href="/docs">Docs</a> <a href="/">&larr; Back home</a></nav>
    </header>
    <main>
      <h1>Get in touch</h1>
      <p class="lede">We read every message. Fill out the form below and we'll get back to you as soon as we can.</p>

      <form class="contact-form" id="contactForm" novalidate>
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" required>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">Send message</button>
        <div class="message" id="formMessage"></div>
      </form>
    </main>

    <footer>
      <div>
        <a href="/docs">Docs</a>
        <a href="/terms">Terms</a>
        <a href="/privacy">Privacy</a>
        <a href="/refunds">Refunds</a>
        <a href="/pricing">Pricing</a>
      </div>
      <div class="contact-footer">TirraMind — deterministic signal infrastructure licensed as an API</div>
    </footer>
  </div>

  <script>
    const contactForm = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const formMessage = document.getElementById('formMessage');

    contactForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      submitBtn.disabled = true;
      formMessage.textContent = '';
      formMessage.className = 'message';

      const formData = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        subject: document.getElementById('subject').value,
        message: document.getElementById('message').value,
      };

      try {
        const response = await fetch('https://api.tirramind.com/api/v1/contact', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(formData),
        });

        if (response.ok) {
          formMessage.textContent = 'Thanks for reaching out! We\'ll be in touch soon.';
          formMessage.className = 'message success';
          contactForm.reset();
        } else {
          console.error('[Contact] Server returned status:', response.status);
          formMessage.textContent = 'Something went wrong. Please try again.';
          formMessage.className = 'message error';
        }
      } catch (error) {
        console.error('[Contact] Form submission error:', error);
        formMessage.textContent = 'Something went wrong. Please try again.';
        formMessage.className = 'message error';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
