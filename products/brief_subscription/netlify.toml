# Netlify static hosting for the TirraMind public site.
# Alternative to Vercel — pick one. This folder is the publish root.

[build]
  publish = "."

# Checkout moved to the Paddle.js overlay on /pricing — Paddle Billing has no
# static reusable checkout links. Keep old /buy links working.
[[redirects]]
  from = "/buy"
  to = "/pricing"
  status = 302

# Proxy the protected brief + webhook to the separate Tirra backend
[[redirects]]
  from = "/brief.json"
  to = "https://api.tirramind.com/brief.json"
  status = 200

[[redirects]]
  from = "/brief.md"
  to = "https://api.tirramind.com/brief.md"
  status = 200

[[redirects]]
  from = "/api/v1/*"
  to = "https://api.tirramind.com/api/v1/:splat"
  status = 200

[[redirects]]
  from = "/evidence/*"
  to = "https://api.tirramind.com/evidence/:splat"
  status = 200

# Clean URLs
[[redirects]]
  from = "/*"
  to = "/:splat.html"
  status = 200
